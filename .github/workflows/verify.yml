name: Verify WeWise

on:
  push:
    branches: [main, codex/live-hackathon-assistant]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wewise-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Backend, gateway and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install OCR system libraries
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-0 libgl1
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile
          python -m pip install -r backend/requirements.lock.txt
          python -m pip install -r backend/requirements-chain.txt
      - name: Backend functional and attack tests
        run: python -m pytest -q -c backend/pytest.ini
      - name: Gateway boundary tests
        run: node --test infra/tests/gateway.test.mjs
      - name: TypeScript and production build
        run: pnpm --dir frontend build
